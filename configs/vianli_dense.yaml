# Reproducible dense baselines for ViANLI.
# Change model.pretrained_model_name to compare another compatible encoder.
# Examples: vinai/phobert-base, xlm-roberta-base, bert-base-multilingual-cased
base_config: vianli.yaml

dataset:
  # Group configs select the segmented path for PhoBERT runs.
  segmented_name: data/vianli_segmented
  original_name: uitnlp/ViANLI
  name: uitnlp/ViANLI

model:
  architecture: dense_transformer
  pretrained_model_name: vinai/phobert-base
  pooling: cls
  freeze_backbone: false

logging:
  use_wandb: true
  project: dense-vianli
  run_name: vianli-dense
