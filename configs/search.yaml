# Start with 12 inexpensive candidates and one seed; repeat only the best three with 3 seeds.
base_config: configs/vihsd.yaml
strategy: random
trials: 12
search_seed: 42
seeds: [42]
fixed:
  training.epochs: 12
  training.selection_metric: macro_f1
  training.evaluate_test: false
parameters:
  training.learning_rate: [0.00005, 0.0001, 0.0002, 0.0003]
  training.weight_decay: [0.0, 0.001, 0.01, 0.03]
  model.dropout: [0.05, 0.1, 0.2, 0.3]
  dataset.max_length: [128, 192, 256]
  model.num_experts: [2, 4, 8]
  model.top_k: [1, 2]
  routing.load_balance_loss_factor: [0.0, 0.001, 0.003, 0.01]
