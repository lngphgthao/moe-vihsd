seed: 42
dataset:
  name: data/vihsd_segmented
  config: null
  text_column: free_text
  label_column: label_id
  tokenizer: vinai/phobert-base
  max_length: 128
  train_split: train
  validation_split: validation
  test_split: test
  tokenization_num_proc: 2
training:
  smoke_test: false
  epochs: 5
  batch_size: 16
  learning_rate: 0.00002
  weight_decay: 0.01
  loss_type: cross_entropy
  focal_gamma: 2.0
  # Set one weight per label when using weighted_cross_entropy or weighted focal loss.
  class_weights: null
  # Keep this at 0 for notebook/Colab compatibility. Override it on a script-only
  # local run (for example, --set training.num_workers=2) if needed.
  num_workers: 0
  max_train_samples: null
  smoke:
    epochs: 1
    max_train_samples: 2000
    max_eval_samples: 500
model:
  architecture: phobert_moe
  pretrained_model_name: vinai/phobert-base
  # phoBERT MoE settings:
  moe_layers: [8, 9, 10, 11] # layers with FFN replaced by token-level MoE
  num_experts: 4
  top_k: 1
  upcycle: true # clone pretrained PhoBERT FFN weights into all experts
  shared_expert: false   # true = always-active shared expert (Stage B experiments)
  expert_type: gelu # gelu, geglu, or swiglu; gated experts require upcycle=false
  expert_hidden_size: null # null = PhoBERT intermediate size; use 2048 for gated experts
  expert_init_noise: 0.0 # e.g. 0.001 to break identical upcycled expert initialization
  learnable_residual_scale: false # experiment 4: learn the MoE residual contribution
  residual_scale_init: 1.0 # use 0.1 for a conservative MoE residual start
  freeze_attention: false # false = full fine-tuning (default); true = parameter-efficient
  freeze_embeddings: false
  pooling: cls # cls or mean
  freeze_backbone: false
  model_dim: 128
  expert_hidden_dim: 512
  dropout: 0.1
routing:
  load_balance_loss_factor: 0.01
paths:
  checkpoint_dir: checkpoints
  results_dir: results
logging:
  use_wandb: true
  project: moe-vihsd
  run_name: full-parameter-moe
