seed: 42
dataset:
  name: uitnlp/vihsd
  config: null
  text_column: free_text
  label_column: label_id
  tokenizer: vinai/phobert-base
  max_length: 128
  train_split: train
  validation_split: validation
  test_split: test
  tokenization_num_proc: 2
training:
  smoke_test: false
  epochs: 5
  batch_size: 16
  learning_rate: 0.0002
  weight_decay: 0.01
  loss_type: cross_entropy
  focal_gamma: 2.0
  class_weights: null
  # Keep this at 0 for notebook/Colab compatibility. Override it on a script-only
  # local run (for example, --set training.num_workers=2) if needed.
  num_workers: 0
  max_train_samples: null
  smoke:
    epochs: 1
    max_train_samples: 2000
model:
  architecture: current_moe
  pretrained_model_name: vinai/phobert-base
  freeze_backbone: false
  model_dim: 128
  expert_hidden_dim: 512
  num_attention_heads: 4
  num_layers: 2
  num_experts: 4
  top_k: 1
  dropout: 0.1
routing:
  load_balance_loss_factor: 0.01
  capacity_factor: 1.25
paths:
  checkpoint_dir: checkpoints
  results_dir: results
logging:
  use_wandb: true
  project: moe-vihsd
  run_name: full-parameter-moe
