base_config: ../vianli.yaml

dataset:
  revision: 0fec8d6ecb043a61c609f9b51f80401fdf1e84d3
  expected_split_sizes: {train: 8012, validation: 1000, test: 1000}

model:
  architecture: nlimoe
  pretrained_model_name: xlm-roberta-base
  pretrained_model_revision: e73636d4f797dec63c3081bb6ed5c7b0bb3f2089
  freeze_backbone: false
  num_experts: 5
  dynamic_num_experts: 5
  dynamic_top_k: 4
  routing_type: top_k
  nlimoe_expert_dropout: 0.4
  classifier_dropout: 0.0

training:
  # Paper leaves the unit unspecified; use global optimizer steps (D005).
  eval_frequency: 400

routing:
  load_balance_loss_factor: 0.01
  dynamic_loss_factor: 0.0

logging:
  use_wandb: false
  project: nlimoe-baseline
  run_name: vianli-nlimoe-topk
