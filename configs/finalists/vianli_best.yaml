# Cấu hình ViANLI hiện tại, unverified.
# XLM-RoBERTa MoE, các lớp [6-11], 6 expert, Dynamic Threshold Routing.
# TODO: Xác minh finalist lịch sử là E4 hay E6 bằng resolved config/checkpoint.
# Tracker và docs/RESULTS.md có cả VIANLI-ROUTE-E4-DYNAMIC-S42 và
# VIANLI-ROUTE-E6-DYNAMIC-S42, đều unverified, thiếu liên kết config/artifact.
# Giữ num_experts hiện tại; comment và run_name mô tả YAML này.
base_config: ../vianli.yaml

seed: 42

dataset:
  name: uitnlp/ViANLI
  tokenizer: xlm-roberta-base

model:
  architecture: transformer_moe
  pretrained_model_name: xlm-roberta-base
  moe_layers: [6, 7, 8, 9, 10, 11]
  num_experts: 6
  routing_method: dynamic_threshold
  transformer_moe_dropout: 0.05

logging:
  use_wandb: true
  project: moe-vianli
  run_name: vianli-xlmr-moe-last6-e6-dynamic
