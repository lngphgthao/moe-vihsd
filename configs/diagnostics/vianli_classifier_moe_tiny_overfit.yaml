# Diagnostic-only tiny-set overfit run for classifier/MoE collapse analysis.
# This intentionally changes only the diagnostic training profile: dataset size and epochs.
base_config: ../vianli.yaml

model:
  architecture: classifier_moe
  pretrained_model_name: xlm-roberta-base

dataset:
  name: uitnlp/ViANLI
  tokenizer: xlm-roberta-base

diagnostics:
  collect_model_diagnostics: true
  tiny_overfit:
    enabled: true
    samples: 150
    epochs: 50
