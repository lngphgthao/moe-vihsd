# Stage C: Shared expert + 8 narrow routed experts (hidden size 1536) with top-2 routing
base_config: ../vihsd.yaml

model:
  architecture: phobert_moe
  moe_layers: [8, 9, 10, 11]
  num_experts: 8
  expert_hidden_size: 1536
  top_k: 2
  expert_type: gelu
  upcycle: false
  shared_expert: true

training:
  loss_type: cross_entropy

routing:
  load_balance_loss_factor: 0.01
