# Stage C: Shared expert + 4 routed experts with top-2 routing
base_config: ../vihsd.yaml

model:
  architecture: phobert_moe
  moe_layers: [8, 9, 10, 11]
  num_experts: 4
  top_k: 2
  expert_type: gelu
  upcycle: true
  shared_expert: true

training:
  loss_type: cross_entropy

routing:
  load_balance_loss_factor: 0.01
